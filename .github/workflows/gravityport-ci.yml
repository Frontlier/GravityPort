name: GravityPort - Source QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source-tests:
    name: Native launcher and compatibility unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out GravityPort sources and preserve history
        uses: actions/checkout@v4
      - name: Python 3.13 for native launcher
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python UI dependencies
        run: python -m pip install --disable-pip-version-check Pillow cryptography
      - name: Verify GravityPort source tests
        run: python -m unittest discover -s tests -p 'test_gravityport*.py' -v
      - name: Verify Xbox compatibility launcher settings
        run: python -m unittest discover -s tests -p 'test_launcher_controls.py' -v
      - name: Verify patch parser and profiles
        run: python -m unittest discover -s tests -p 'test_patches.py' -v
      - name: Verify public v0.4.0 release contract and license documentation
        run: python -m unittest discover -s tests -p 'test_public_release_contract.py' -v
      - name: Verify Windows Inno Setup installer source and safety contract
        run: python -m unittest discover -s tests -p 'test_windows_installer_contract.py' -v
      - name: Check native launcher Python syntax
        run: python -m py_compile launcher/gravityport_dashboard.py launcher/gravityport_metrics.py launcher/gravityport_pad_tester.py launcher/gravityport_pt.py launcher/launcher_ui.py launcher/gravityrush_launcher.py scripts/patches.py tools/verify_public_release.py tools/smoke_public_release.py
      - name: Check for console binaries in Git
        shell: pwsh
        run: |
          $blocked = @(git ls-files | Where-Object { $_ -match '(^|/)(eboot\.bin|sce_sys|sce_module|savedata)(/|$)|\.(pkg|prx|psarc|self|rif|rap)$' })
          if ($blocked.Count -gt 0) { $blocked; throw "Commercial game files are prohibited in source control." }
